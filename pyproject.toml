[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "featsel"
version = "0.1.0"
description = "Feature selection pipeline for high-dimensional data with a focus on genomics and bioinformatics"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Dror Meirovich", email = "dror@drorm.com"}
]
maintainers = [
    {name = "Dror Meirovich", email = "dror@drorm.com"}
]
keywords = [
    "feature-selection",
    "machine-learning",
    "genomics",
    "bioinformatics",
    "high-dimensional-data",
    "gene-expression",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "pyyaml>=5.4.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]
optuna = [
    "optuna>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/drormeir/featsel"
Documentation = "https://github.com/drormeir/featsel#readme"
Repository = "https://github.com/drormeir/featsel"
"Bug Reports" = "https://github.com/drormeir/featsel/issues"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["featsel*"]
exclude = ["tests*", "docs*", "notebooks*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]
