# All 28,552 genes, no selection, on the SCAN-B comparison's splits
# (comparison_scanb.yaml): the same protocol and the same 16 splits, so its
# rows pair with every method's split by split (gap A3). Random selection of
# every gene is no selection. A separate CSV, because the runner now writes
# more columns than the comparison's CSV holds.
# Tuning C on all genes fits 15 models per cell on 1,488 x 28,552: hours.
# Run with: python -m featsel.run --config configs/comparison_scanb_all_genes.yaml --n-jobs 4 --max-worker-memory-gb 3

dataset: "featsel_datasets.scanb_gse96058.featsel_view"
target: "pam50 subtype"

output: "../results/comparison_scanb_all_genes.csv"

seed: 42
n_splits: 16
train_sizes: [0.5]
preprocess: ["standard"]
selection_repeats: 1

metrics:
  - accuracy
  - macro_f1
  - balanced_accuracy
  - mcc
  - g_mean

tuning:
  n_splits: 3
  train_size: 0.5
  scoring: roc_auc

selectors:
  - name: RandomSelector
    label: AllGenes
    k: [28552]

models:
  - name: logistic_regression
    params:
      max_iter: 1000
    grid:
      C: [0.01, 0.1, 1, 10, 100]
