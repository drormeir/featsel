# RFECV on the BreastMNIST frontier's splits, with ROC AUC as its inner
# score, to match frontier_scanb70_rfecv_auc.yaml.
# Run with: python -m featsel.run --config configs/frontier_breastmnist70_rfecv_auc.yaml --n-jobs 2
#
# Output goes to results/local/, which git ignores.

dataset: "featsel_datasets.medmnist_breastmnist.featsel_view"
target: "label"

output: "../results/local/frontier_breastmnist70_rfecv_auc.csv"

seed: 42
n_splits: 16
train_sizes: [0.7]
preprocess: ["standard"]

metrics:
  - roc_auc
  - macro_f1
  - balanced_accuracy

selectors:
  - name: RFECVSelector
    label: RFECV_newton_auc
    params: {C: 0.01, cv: 5, solver: "newton", device: "cpu", scoring: "roc_auc"}

models:
  - name: logistic_regression
    params:
      max_iter: 1000
