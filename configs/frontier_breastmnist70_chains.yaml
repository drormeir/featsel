# Two-stage selection on the BreastMNIST frontier: Mann-Whitney on the GPU
# keeps 500 of the 2,048 features, then a slower method picks k of them. The
# same splits as frontier_breastmnist70_cpu.yaml, where each last step runs
# alone on all features. The selection time covers both steps.
# Run with: python -m featsel.run --config configs/frontier_breastmnist70_chains.yaml --n-jobs 1
#
# One worker: the first step uses the GPU.
# Output goes to results/local/, which git ignores.

dataset: "featsel_datasets.medmnist_breastmnist.featsel_view"
target: "label"

output: "../results/local/frontier_breastmnist70_chains.csv"

seed: 42
n_splits: 5
train_sizes: [0.7]
preprocess: ["standard"]

metrics:
  - roc_auc
  - macro_f1
  - balanced_accuracy

selectors:
  - label: MW500+Lasso_liblinear
    k: [10, 50, 250]
    steps:
      - name: MannWhitneySelector
        params: {n_features: 500, device: "cuda"}
      - name: LassoSelector
        params: {C: 1.0}
  - label: MW500+TreeImportance
    k: [10, 50, 250]
    steps:
      - name: MannWhitneySelector
        params: {n_features: 500, device: "cuda"}
      - name: TreeImportanceSelector
        params: {n_estimators: 200, n_jobs: 4}
  - label: MW500+RFE_newton
    k: [10, 50, 250]
    steps:
      - name: MannWhitneySelector
        params: {n_features: 500, device: "cuda"}
      - name: RFESelector
        params: {C: 0.01, solver: "newton", device: "cpu"}

models:
  - name: logistic_regression
    params:
      max_iter: 1000
