# SCAN-B breast cancer, GSE96058 (Brueffer et al., 2018).
# The loader downloads and caches the published files on first use.
# See featsel_datasets/scanb_gse96058/ and docs/report/03_data.md.

name: "SCAN-B GSE96058"
loader: "featsel_datasets.scanb_gse96058.featsel_view:load_xy"
target_column: "pam50 subtype"   # default target; an experiment's 'target' overrides it

# This project's choices, passed to the loader.
params:
  instrument: "HiSeq 2000"   # one sequencing machine, no cross-machine differences
  one_per_specimen: true     # one sample per patient: repeats would leak across splits
