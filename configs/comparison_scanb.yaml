# The smallest complete selector comparison on SCAN-B (tasks 1-2, NEXT.md
# step 2): every selector of smoke_scanb.yaml, k = 10, 50 and 250, logistic
# regression with C tuned inside each split, the five PAM50 subtype-vs-rest
# tasks, 5 splits. Protocol: docs/experiment_design.md.
# Run with: python -m featsel.run --config configs/comparison_scanb.yaml --n-jobs 6 --max-worker-memory-gb 3.5

dataset: "featsel_datasets.scanb_gse96058.featsel_view"
target: "pam50 subtype"

output: "../results/comparison_scanb.csv"

seed: 42
n_splits: 5
train_sizes: [0.5]
preprocess: ["standard"]

metrics:
  - accuracy
  - macro_f1
  - balanced_accuracy
  - mcc
  - g_mean

tuning:
  n_splits: 3
  train_size: 0.5
  scoring: roc_auc

selectors:
  - name: RandomSelector
    k: [10, 50, 250]
  - name: MannWhitneySelector
    k: [10, 50, 250]
  - name: LassoSelector
    k: [10, 50, 250]
    params:
      C: 1.0
  - name: TreeImportanceSelector
    k: [10, 50, 250]
    params:
      n_estimators: 200
  - name: RFESelector
    k: [10, 50, 250]
    params:
      C: 0.01
  - name: HigherCriticismSelector
    label: HC2004
    params:
      variant: "2004"
  - name: HigherCriticismSelector
    label: HC2008
    params:
      variant: "2008"

models:
  - name: logistic_regression
    params:
      max_iter: 1000
    grid:
      C: [0.01, 0.1, 1, 10, 100]
