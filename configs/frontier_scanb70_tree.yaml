# Tree importance alone on the SCAN-B frontier, for more splits (gap A4).
# The same selector, parameters and splits as in frontier_scanb70_cpu.yaml,
# without the slow wrappers, so the top methods can be compared on 16 splits:
# this file, frontier_scanb70_gpu.yaml and frontier_scanb70_berkjones.yaml.
#
# Its CSV starts as a copy of the cpu run's tree importance rows (splits 0 to
# 4), so --resume computes only the new splits. Do not give both this CSV and
# frontier_scanb70_cpu.csv to the same plot: their first 5 splits are the
# same rows.
#
# Two workers, as in the cpu run, so the times compare.
# Run with: python scripts/run_until_done.py --config configs/frontier_scanb70_tree.yaml --n-jobs 2 --n-splits 16
#
# Output goes to results/local/, which git ignores.

dataset: "featsel_datasets.scanb_gse96058.featsel_view"
target: "pam50 subtype"

output: "../results/local/frontier_scanb70_tree.csv"

seed: 42
n_splits: 5
train_sizes: [0.7]
preprocess: ["standard"]

metrics:
  - roc_auc
  - macro_f1
  - balanced_accuracy

selectors:
  - name: TreeImportanceSelector
    k: [10, 50, 250, 1000]
    params: {n_estimators: 200, n_jobs: 4}

models:
  - name: logistic_regression
    params:
      max_iter: 1000
