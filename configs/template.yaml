# =============================================================================
# Dataset Configuration Template
# =============================================================================
# Copy this file and modify for your dataset.
# Required fields are marked with [REQUIRED], others are optional with defaults.
# Fields marked [DESCRIPTIVE] document the dataset; the code does not read them.
# Selectors, models, splits and preprocessing belong in an experiment config
# (see experiment_classifiers.yaml), not here.

# -----------------------------------------------------------------------------
# Basic Information
# -----------------------------------------------------------------------------
name: "Dataset Name"                    # [REQUIRED] Human-readable name
description: "Brief description"        # Optional description

# -----------------------------------------------------------------------------
# File Paths (relative to this config file)
# -----------------------------------------------------------------------------
paths:
  features: "../datasets/<name>/features.csv"   # [REQUIRED] Feature matrix
  metadata: "../datasets/<name>/metadata.csv"   # [REQUIRED] Sample metadata

# -----------------------------------------------------------------------------
# Column Mappings
# -----------------------------------------------------------------------------
sample_id_column: "sample_id"           # [REQUIRED] Column name for sample IDs
target_column: "target"                 # [REQUIRED] Column name for target variable

# -----------------------------------------------------------------------------
# Task Configuration
# -----------------------------------------------------------------------------
task:
  # Type of prediction task
  type: "classification"                # [DESCRIPTIVE] classification | regression

  # For classification only: binary or multiclass
  classification_type: "multiclass"     # binary | multiclass

# -----------------------------------------------------------------------------
# Target Classes (Classification Only)
# -----------------------------------------------------------------------------
# List expected class labels for validation and reporting
target_classes:                         # [DESCRIPTIVE]
  - "class_1"
  - "class_2"
  - "class_3"

# -----------------------------------------------------------------------------
# Data Format
# -----------------------------------------------------------------------------
# Feature matrix orientation
transpose_features: false               # Default: false
                                        # true  = features.csv has samples as COLUMNS (genes x samples)
                                        # false = features.csv has samples as ROWS (samples x genes)

separator: ","                          # Default: "," (CSV delimiter)

# -----------------------------------------------------------------------------
# Alternative Targets (Optional)
# -----------------------------------------------------------------------------
# Other prediction targets available in the metadata [DESCRIPTIVE].
# An experiment config picks one with its `target` key.
alternative_targets:
  - column: "other_target"
    description: "Description of this target"
    task_type: "classification"         # classification | regression
    classification_type: "binary"       # binary | multiclass (if classification)
