# FGVC-Aircraft, Boeing 737 against the Airbus A320 family: an unseen
# dataset run end to end on the GPU. 1,198 photos (two near-identical shots
# dropped, demos/duplicates.ipynb), each a 2,048-number
# ResNet-50 embedding (featsel_datasets/fgvc_aircraft/). Every selector
# runs with device='cuda', except tree importance, which has no GPU path;
# the embeddings are computed on the GPU too.
# Berk-Jones, tree importance, the chains and RFECV scored by accuracy
# were added later, with --resume: the same splits, the earlier rows kept.
# The classifier is scikit-learn's logistic regression, on the CPU.
# Run with: python -m featsel.run --config configs/aircraft70_gpu.yaml --n-jobs 1
#
# k runs to 1,000, as on BreastMNIST; validation picks it.
# Random at k = 2048 is every feature, no selection.
# Three fits per selection, to time each one without a long run.

dataset: "featsel_datasets.fgvc_aircraft.featsel_view"
# No duplicates (docs/DECISIONS.md, 2026-11-21).
dataset_params:
  drop_copies: true
target: "family"

output: "../results/aircraft70_gpu.csv"

seed: 42
n_splits: 16
train_sizes: [0.7]
preprocess: ["standard"]
# Each method with a k list gets a validation AUC per k, from 5 folds of the
# training set, so k can be chosen without the test set (featsel.chosen_k).
k_validation:
  cv: 5
selection_repeats: 3

metrics:
  - roc_auc
  - macro_f1
  - balanced_accuracy

selectors:
  - name: RandomSelector
    k: [10, 50, 250, 500, 1000, 2048]
  - name: MannWhitneySelector
    k: [10, 50, 250, 500, 1000]
    params: {device: "cuda"}
  - name: HigherCriticismSelector
    label: HC2008
    params: {variant: "2008", device: "cuda"}
  - name: HigherCriticismSelector
    label: HC2004
    params: {variant: "2004", device: "cuda"}
  - name: CorrelationSelector
    k: [10, 50, 250, 500, 1000]
    params: {method: "spearman", device: "cuda"}
  - name: MutualInfoSelector
    k: [10, 50, 250, 500, 1000]
    params: {device: "cuda"}
  # No k: C, chosen from Cs by validation AUC, sets the count.
  - name: LassoSelector
    label: Lasso_ppdna
    params: {Cs: [0.01, 0.1, 1.0, 10.0], cv: 5, device: "cuda"}
  - name: RFESelector
    label: RFE_newton
    k: [10, 50, 250, 500, 1000]
    params: {C: 0.01, device: "cuda"}
  - name: RFECVSelector
    label: RFECV_newton_auc
    params: {C: 0.01, cv: 5, scoring: "roc_auc", device: "cuda"}
  - name: RFECVSelector
    label: RFECV_newton
    params: {C: 0.01, cv: 5, device: "cuda"}
  - name: BerkJonesSelector
    label: BerkJones
    params: {device: "cuda"}
  - name: TreeImportanceSelector
    k: [10, 50, 250, 500, 1000]
    params: {n_estimators: 200, n_jobs: 4}
  # Mann-Whitney keeps 500 features, as on BreastMNIST, then a slower
  # method picks from them. The selection time covers both steps.
  - label: MW500+Lasso_ppdna
    steps:
      - name: MannWhitneySelector
        params: {n_features: 500, device: "cuda"}
      - name: LassoSelector
        params: {Cs: [0.01, 0.1, 1.0, 10.0], cv: 5, device: "cuda"}
  - label: MW500+TreeImportance
    k: [10, 50, 250]
    steps:
      - name: MannWhitneySelector
        params: {n_features: 500, device: "cuda"}
      - name: TreeImportanceSelector
        params: {n_estimators: 200, n_jobs: 4}
  - label: MW500+RFE_newton
    k: [10, 50, 250]
    steps:
      - name: MannWhitneySelector
        params: {n_features: 500, device: "cuda"}
      - name: RFESelector
        params: {C: 0.01, device: "cuda"}
  - name: SequentialSelector
    label: Sequential_newton
    k: [5, 10]
    k_validation: false   # a fit takes minutes; five folds per k would take hours
    params: {cv: 5, solver: "newton", device: "cuda"}

models:
  - name: logistic_regression
    params:
      max_iter: 1000
