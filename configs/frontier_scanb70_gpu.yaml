# The cost-quality frontier on SCAN-B, training on 70% of the patients: the
# selectors that run on the GPU. frontier_scanb70_seq.yaml (Sequential) and
# frontier_scanb70_cpu.yaml run the rest on the same splits;
# scripts/plot_frontier.py draws all three as one plot.
# Run with: python -m featsel.run --config configs/frontier_scanb70_gpu.yaml --n-jobs 1
#
# One worker: a fit's time includes any wait for the GPU, so two workers
# sharing it would inflate each other's times. device: cuda fixes the device,
# where 'auto' would fall back to the CPU while the GPU is busy.
#
# Output goes to results/local/, which git ignores.

dataset: "featsel_datasets.scanb_gse96058.featsel_view"
target: "pam50 subtype"

output: "../results/local/frontier_scanb70_gpu.csv"

seed: 42
n_splits: 16
train_sizes: [0.7]
preprocess: ["standard"]

metrics:
  - roc_auc
  - macro_f1
  - balanced_accuracy

selectors:
  - name: RandomSelector
    k: [10, 50, 250, 1000]
  - name: MannWhitneySelector
    k: [10, 50, 250, 1000]
    params: {device: "cuda"}
  - name: HigherCriticismSelector
    label: HC2008
    params: {variant: "2008", device: "cuda"}
  - name: CorrelationSelector
    k: [10, 50, 250, 1000]
    params: {method: "spearman", device: "cuda"}
  - name: MutualInfoSelector
    k: [10, 50, 250, 1000]
    params: {device: "cuda"}
  - name: LassoSelector
    label: Lasso_ppdna
    k: [10, 50, 250, 1000]
    params: {C: 1.0, solver: "ppdna", device: "cuda"}

models:
  - name: logistic_regression
    params:
      max_iter: 1000
