# Random-selection baseline on the SCAN-B target: one binary task per PAM50
# subtype, that subtype against the other four.
#
# This establishes the control level every other selector is measured against.
# It is not a comparison in itself, so it carries one selector, one train
# fraction and no preprocessing sweep.
#
# Run with: python -m featsel.run --config configs/experiment_baseline.yaml

dataset: "featsel_datasets.scanb_gse96058.featsel_view"
target: "pam50 subtype"

output: "../results/baseline_random.csv"

seed: 42
n_splits: 100
train_sizes: [0.5]        # a control is only valid against methods at the same fraction
preprocess: ["standard"]

metrics:
  - accuracy
  - macro_f1
  - balanced_accuracy
  - mcc
  - g_mean

selectors:
  - name: RandomSelector
    k: [10, 25, 50, 100, 250, 500, 1000]

# One classifier for this first pass. Logistic regression was the strongest
# model in the earlier grid, so the control level it establishes is the one
# that matters most. The others are added once this run is understood.
models:
  - name: logistic_regression
    params:
      max_iter: 1000
