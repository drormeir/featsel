# Berk-Jones added to the SCAN-B comparison (comparison_scanb.yaml): the same
# protocol and the same 16 splits, so its rows pair with the comparison's
# split by split. A separate CSV, because the runner now writes more columns
# than the comparison's CSV holds. One fit per selection, as in the comparison.
# Run with: python -m featsel.run --config configs/comparison_scanb_berkjones.yaml --n-jobs 4 --max-worker-memory-gb 3

dataset: "featsel_datasets.scanb_gse96058.featsel_view"
target: "pam50 subtype"

output: "../results/comparison_scanb_berkjones.csv"

seed: 42
n_splits: 16
train_sizes: [0.5]
preprocess: ["standard"]
selection_repeats: 1

metrics:
  - accuracy
  - macro_f1
  - balanced_accuracy
  - mcc
  - g_mean

tuning:
  n_splits: 3
  train_size: 0.5
  scoring: roc_auc

selectors:
  - name: BerkJonesSelector
    label: BerkJones

models:
  - name: logistic_regression
    params:
      max_iter: 1000
    grid:
      C: [0.01, 0.1, 1, 10, 100]
