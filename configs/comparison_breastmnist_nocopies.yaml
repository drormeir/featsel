# The BreastMNIST comparison (comparison_breastmnist.yaml) without the copied
# images: 585 of the 780 images (featsel_datasets/medmnist_breastmnist/copies.py).
# Everything else is the same, with Berk-Jones added. The images differ, so
# the splits do not pair with the original run's.
# Run with: python -m featsel.run --config configs/comparison_breastmnist_nocopies.yaml --n-jobs 4

dataset: "featsel_datasets.medmnist_breastmnist.featsel_view"
dataset_params:
  drop_copies: true
target: "label"

output: "../results/comparison_breastmnist_nocopies.csv"

seed: 42
n_splits: 20
train_sizes: [0.5]
preprocess: ["standard"]
selection_repeats: 1

metrics:
  - accuracy
  - macro_f1
  - balanced_accuracy
  - mcc
  - g_mean

tuning:
  n_splits: 3
  train_size: 0.5
  scoring: roc_auc

selectors:
  - name: RandomSelector
    k: [5, 10, 20, 50, 100, 204, 250]   # 204: HC2008's count on the full set
  - name: MannWhitneySelector
    k: [5, 10, 20, 50, 100, 204, 250]
  - name: LassoSelector
    k: [5, 10, 20, 50, 100, 250]
    params:
      C: 1.0
  - name: TreeImportanceSelector
    k: [5, 10, 20, 50, 100, 250]
    params:
      n_estimators: 50
  - name: RFESelector
    k: [5, 10, 20, 50, 100, 250]
    params:
      C: 0.01
      step: 0.5
  - name: HigherCriticismSelector
    label: HC2004
    params:
      variant: "2004"
  - name: HigherCriticismSelector
    label: HC2008
    params:
      variant: "2008"
  - name: BerkJonesSelector
    label: BerkJones

models:
  - name: logistic_regression
    params:
      max_iter: 1000
    grid:
      C: [0.01, 0.1, 1, 10, 100]
