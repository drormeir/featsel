# Experiment definition for SCAN-B. Every axis of the study lives here.
# Run with: python -m featsel.run --config configs/experiment_scanb.yaml

dataset: "configs/scanb_small.yaml"
target: "PAM50"          # omit to use the dataset config's default target

output: "results/experiment_scanb.csv"

# Resampling: independent Monte Carlo splits, not k-fold. See
# docs/experiment_design.md section 2a for why.
seed: 42
n_splits: 100
train_sizes: [0.5, 0.7, 0.9]

preprocess: ["standard"]   # also available: "none", "quantile_normal"

metrics:
  - accuracy
  - macro_f1
  - balanced_accuracy
  - mcc
  - g_mean

# Feature selectors. 'name' is a FeatureSelector method; 'k' is the sweep.
selectors:
  - name: random           # the control every other method must beat
    k: [10, 25, 50, 100, 250, 500, 1000]
  - name: anova_f
    k: [10, 25, 50, 100, 250, 500, 1000]
  - name: lasso
    k: [10, 25, 50, 100, 250, 500, 1000]
    params:
      C: 1.0
  - name: tree_importance
    k: [10, 25, 50, 100, 250, 500, 1000]
    params:
      n_estimators: 200

# Classifiers. 'params' is passed straight to the sklearn estimator, so the
# protocol is visible in the config rather than buried in code.
models:
  - name: logistic_regression
    params:
      max_iter: 1000
  - name: linear_svm
    params:
      max_iter: 20000
  - name: random_forest
    params:
      n_estimators: 200
      n_jobs: 1
  - name: knn
    params:
      n_neighbors: 5
  - name: lda
    label: lda_shrinkage
    params:
      solver: "lsqr"
      shrinkage: "auto"
