# The cost-quality frontier on SCAN-B, training on 70% of the patients:
# Sequential selection on the GPU, on the same splits as
# frontier_scanb70_gpu.yaml and frontier_scanb70_cpu.yaml.
# Run with: python -m featsel.run --config configs/frontier_scanb70_seq.yaml --n-jobs 1
#
# One fit per selection, not the default 10: a fit takes minutes, and 10
# would take about a day. One worker, as for the other GPU selectors.
#
# Output goes to results/local/, which git ignores.

dataset: "featsel_datasets.scanb_gse96058.featsel_view"
target: "pam50 subtype"

output: "../results/local/frontier_scanb70_seq.csv"

seed: 42
n_splits: 16
train_sizes: [0.7]
preprocess: ["standard"]
selection_repeats: 1

metrics:
  - roc_auc
  - macro_f1
  - balanced_accuracy

selectors:
  - name: SequentialSelector
    label: Sequential_newton
    k: [5, 10]
    params: {cv: 5, solver: "newton", device: "cuda"}

models:
  - name: logistic_regression
    params:
      max_iter: 1000
