# The BreastMNIST frontier with the copied images, on a training set as
# small as that of the run without them: 409 of the 780 images in the
# training set (train_size 0.5244), 371 in the test set. Without the copies
# (frontier_breastmnist70_nocopies.yaml) the training set has 409 images
# against 546 in the main runs, so the fall in scores there has two
# possible causes: the copies and the smaller training set. This run keeps
# the copies and changes only the size, so it separates the two.
# The methods and settings are those of frontier_breastmnist70_nocopies.yaml.
# The splits differ from both other runs, so they do not pair.
# Run with: python -m featsel.run --config configs/frontier_breastmnist70_n409.yaml --n-jobs 1
#
# Output goes to results/local/, which git ignores.

dataset: "featsel_datasets.medmnist_breastmnist.featsel_view"
target: "label"

output: "../results/local/frontier_breastmnist70_n409.csv"

seed: 42
n_splits: 16
train_sizes: [0.5244]
preprocess: ["standard"]
# Each method with a k list gets a validation AUC per k, from 5 folds of the
# training set, so k can be chosen without the test set (featsel.chosen_k).
k_validation:
  cv: 5

metrics:
  - roc_auc
  - macro_f1
  - balanced_accuracy

selectors:
  - name: RandomSelector
    k: [10, 50, 250, 500, 1000, 2048]
  - name: MannWhitneySelector
    k: [10, 50, 250, 500, 1000]
    params: {device: "cuda"}
  - name: HigherCriticismSelector
    label: HC2008
    params: {variant: "2008", device: "cuda"}
  - name: HigherCriticismSelector
    label: HC2004
    params: {variant: "2004", device: "cuda"}
  - name: BerkJonesSelector
    label: BerkJones
    params: {device: "cuda"}
  # No k: C, chosen from Cs by validation AUC, sets the count.
  - name: LassoSelector
    label: Lasso_ppdna
    params: {Cs: [0.01, 0.1, 1.0, 10.0], cv: 5, device: "cuda"}
  - name: TreeImportanceSelector
    k: [10, 50, 250, 500, 1000]
    params: {n_estimators: 200, n_jobs: 4}
  - name: RFESelector
    label: RFE_newton
    k: [10, 50, 250, 500, 1000]
    params: {C: 0.01, device: "cpu"}
  - name: CorrelationSelector
    k: [10, 50, 250, 500, 1000]
    params: {method: "spearman", device: "cuda"}
  - name: MutualInfoSelector
    k: [10, 50, 250, 500, 1000]
    params: {device: "cuda"}
  - name: RFECVSelector
    label: RFECV_newton
    params: {C: 0.01, cv: 5, device: "cpu"}
  - name: RFECVSelector
    label: RFECV_newton_auc
    params: {C: 0.01, cv: 5, device: "cpu", scoring: "roc_auc"}
  - label: MW500+Lasso_ppdna
    steps:
      - name: MannWhitneySelector
        params: {n_features: 500, device: "cuda"}
      - name: LassoSelector
        params: {Cs: [0.01, 0.1, 1.0, 10.0], cv: 5, device: "cuda"}
  - label: MW500+TreeImportance
    k: [10, 50, 250]
    steps:
      - name: MannWhitneySelector
        params: {n_features: 500, device: "cuda"}
      - name: TreeImportanceSelector
        params: {n_estimators: 200, n_jobs: 4}
  - label: MW500+RFE_newton
    k: [10, 50, 250]
    steps:
      - name: MannWhitneySelector
        params: {n_features: 500, device: "cuda"}
      - name: RFESelector
        params: {C: 0.01, device: "cpu"}

models:
  - name: logistic_regression
    params:
      max_iter: 1000
