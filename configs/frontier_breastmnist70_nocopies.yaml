# The BreastMNIST frontier without the copied images: 585 of the 780 images
# (featsel_datasets/medmnist_breastmnist/copies.py), 70% training, ROC AUC.
# The main methods of frontier_breastmnist70_gpu.yaml and _cpu.yaml, and
# all 2,048 features (random selection at k = 2048). The images differ, so the
# splits do not pair with the original runs'.
# Run with: python -m featsel.run --config configs/frontier_breastmnist70_nocopies.yaml --n-jobs 1
#
# Output goes to results/local/, which git ignores.

dataset: "featsel_datasets.medmnist_breastmnist.featsel_view"
dataset_params:
  drop_copies: true
target: "label"

output: "../results/local/frontier_breastmnist70_nocopies.csv"

seed: 42
n_splits: 16
train_sizes: [0.7]
preprocess: ["standard"]

metrics:
  - roc_auc
  - macro_f1
  - balanced_accuracy

selectors:
  - name: RandomSelector
    k: [10, 50, 250, 2048]
  - name: MannWhitneySelector
    k: [10, 50, 250]
    params: {device: "cuda"}
  - name: HigherCriticismSelector
    label: HC2008
    params: {variant: "2008", device: "cuda"}
  - name: BerkJonesSelector
    label: BerkJones
    params: {device: "cuda"}
  - name: LassoSelector
    label: Lasso_liblinear
    k: [10, 50, 250]
    params: {C: 1.0}
  - name: TreeImportanceSelector
    k: [10, 50, 250]
    params: {n_estimators: 200, n_jobs: 4}
  - name: RFESelector
    label: RFE_newton
    k: [10, 50, 250]
    params: {C: 0.01, solver: "newton", device: "cpu"}

models:
  - name: logistic_regression
    params:
      max_iter: 1000
