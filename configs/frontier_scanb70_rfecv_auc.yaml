# RFECV on the SCAN-B frontier's splits, with ROC AUC as its inner score.
# Its default inner score, accuracy, kept 1 or 2 genes on the imbalanced
# tasks in frontier_scanb70_cpu.yaml (RFECV_newton). Same splits, same
# settings otherwise; scripts/plot_frontier.py can draw it with the rest.
# Run with: python -m featsel.run --config configs/frontier_scanb70_rfecv_auc.yaml --n-jobs 2
#
# Output goes to results/local/, which git ignores.

dataset: "featsel_datasets.scanb_gse96058.featsel_view"
target: "pam50 subtype"

output: "../results/local/frontier_scanb70_rfecv_auc.csv"

seed: 42
n_splits: 5
train_sizes: [0.7]
preprocess: ["standard"]

metrics:
  - roc_auc
  - macro_f1
  - balanced_accuracy

selectors:
  - name: RFECVSelector
    label: RFECV_newton_auc
    params: {C: 0.01, cv: 5, solver: "newton", device: "cpu", scoring: "roc_auc"}

models:
  - name: logistic_regression
    params:
      max_iter: 1000
