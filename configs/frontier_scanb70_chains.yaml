# Two-stage selection on the SCAN-B frontier: Mann-Whitney on the GPU keeps
# 1,000 genes, then a slower method picks k of them. The same splits as
# frontier_scanb70_cpu.yaml, where each last step runs alone on all genes.
# The selection time covers both steps.
# Run with: python -m featsel.run --config configs/frontier_scanb70_chains.yaml --n-jobs 1
#
# One worker: the first step uses the GPU.
# Output goes to results/local/, which git ignores.

dataset: "featsel_datasets.scanb_gse96058.featsel_view"
target: "pam50 subtype"

output: "../results/local/frontier_scanb70_chains.csv"

seed: 42
n_splits: 16
train_sizes: [0.7]
preprocess: ["standard"]
# Each method with a k list gets a validation AUC per k, from 5 folds of the
# training set, so k can be chosen without the test set (featsel.chosen_k).
k_validation:
  cv: 5

metrics:
  - roc_auc
  - macro_f1
  - balanced_accuracy

selectors:
  # No k: Lasso's C, chosen from Cs by validation AUC, sets the count.
  - label: MW1000+Lasso_ppdna
    steps:
      - name: MannWhitneySelector
        params: {n_features: 1000, device: "cuda"}
      - name: LassoSelector
        params: {Cs: [0.01, 0.1, 1.0, 10.0], cv: 5, device: "cuda"}
  - label: MW1000+TreeImportance
    k: [10, 50, 250, 500]
    steps:
      - name: MannWhitneySelector
        params: {n_features: 1000, device: "cuda"}
      - name: TreeImportanceSelector
        params: {n_estimators: 200, n_jobs: 4}
  - label: MW1000+RFE_newton
    k: [10, 50, 250, 500]
    steps:
      - name: MannWhitneySelector
        params: {n_features: 1000, device: "cuda"}
      - name: RFESelector
        params: {C: 0.01, device: "cpu"}

models:
  - name: logistic_regression
    params:
      max_iter: 1000
