# The cost-quality frontier on BreastMNIST without the copied images, 70%
# training: Sequential selection on the GPU, on the same splits as
# frontier_breastmnist70_nocopies.yaml.
# Run with: python -m featsel.run --config configs/frontier_breastmnist70_nocopies_seq.yaml --n-jobs 1
#
# One fit per selection, as on SCAN-B (frontier_scanb70_seq.yaml).
#
# Output goes to results/local/, which git ignores.

dataset: "featsel_datasets.medmnist_breastmnist.featsel_view"
# No duplicates (docs/DECISIONS.md, 2026-11-21).
dataset_params:
  drop_copies: true
target: "label"

output: "../results/local/frontier_breastmnist70_nocopies_seq.csv"

seed: 42
n_splits: 16
train_sizes: [0.7]
preprocess: ["standard"]
selection_repeats: 1

metrics:
  - roc_auc
  - macro_f1
  - balanced_accuracy

selectors:
  - name: SequentialSelector
    label: Sequential_newton
    k: [5, 10]
    params: {cv: 5, solver: "newton", device: "cuda"}

models:
  - name: logistic_regression
    params:
      max_iter: 1000
