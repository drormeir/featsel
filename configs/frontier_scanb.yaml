# The cost-quality frontier on SCAN-B: selection time against ROC AUC, for
# every selector and solver this machine can run, on the same splits.
# scripts/plot_frontier.py draws it from the output.
# Run with: python -m featsel.run --config configs/frontier_scanb.yaml --n-jobs 2
#
# Output goes to results/local/, which git ignores. Each label is one point
# per k. Selectors whose own variants give different genes (liblinear and
# Newton) are separate labels, so the plot shows both.

dataset: "featsel_datasets.scanb_gse96058.featsel_view"
target: "pam50 subtype"

output: "../results/local/frontier_scanb.csv"

seed: 42
n_splits: 5
train_sizes: [0.5]
preprocess: ["standard"]

metrics:
  - roc_auc
  - macro_f1
  - balanced_accuracy

selectors:
  - name: RandomSelector
    k: [10, 50, 250, 1000]
  - name: MannWhitneySelector
    k: [10, 50, 250, 1000]
  - name: HigherCriticismSelector
    label: HC2008
    params: {variant: "2008"}
  - name: CorrelationSelector
    k: [10, 50, 250, 1000]
    params: {method: "spearman"}
  - name: MutualInfoSelector
    k: [10, 50, 250, 1000]
  - name: LassoSelector
    k: [10, 50, 250, 1000]
    params: {C: 1.0}
  - name: TreeImportanceSelector
    k: [10, 50, 250, 1000]
    params: {n_estimators: 200, n_jobs: 4}
  - name: RFESelector
    label: RFE_liblinear
    k: [10, 50, 250, 1000]
    params: {C: 0.01}
  - name: RFESelector
    label: RFE_newton
    k: [10, 50, 250, 1000]
    params: {C: 0.01, solver: "newton", device: "auto"}
  - name: RFECVSelector
    label: RFECV_newton
    params: {C: 0.01, cv: 5, solver: "newton", device: "auto"}
  - name: SequentialSelector
    label: Sequential_newton
    k: [5, 10]
    params: {cv: 5, solver: "newton", device: "auto"}

models:
  - name: logistic_regression
    params:
      max_iter: 1000
